<template>
  <require from="./now-playing.css"></require>
  <div class="now-playing card">
    <div class="artwork">
      <img src.bind="artwork || '/assets/cover-placeholder.png'" alt="Artwork" />
    </div>
    <div class="meta">
      <div class="title">${title || 'Not Playing'}</div>
      <div class="artist">${artist || ''}</div>
      <div class="progress">
        <span class="time">${formatTime(position)}</span>
        <input type="range" min="0" max.bind="duration || 0" value.bind="position" input.trigger="onSeek($event)" />
        <span class="time">${formatTime(duration)}</span>
      </div>
    </div>
  </div>
</template>
