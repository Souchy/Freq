<template>
  <require from="./player.css"></require>
  <div class="player">
    <div class="file-picker">
        <label>Select files:</label>
        <input type="file" multiple change.trigger="onFileChange($event)" />
        <label>Select folder:</label>
        <input type="file" webkitdirectory directory change.trigger="onFolderSelect($event)" />
      </div>

      <div class="controls">
        <button click.trigger="playSelected()">Play</button>
        <button click.trigger="pause()">Pause</button>
        <button click.trigger="resume()">Resume</button>
        <button click.trigger="stop()">Stop</button>
      </div>

      <div class="now-playing">Now playing: ${currentTitle}</div>

      <div class="playlist">
        <h3>Playlist</h3>
        <ul>
          <li repeat.for="t of playlist" css.bind="{ fontWeight: t.path === currentPath ? 'bold' : 'normal' }">
            <a click.trigger="selectTrack(t)">${t.name}</a>
          </li>
        </ul>
      </div>

      <div class="settings">
        <h3>Settings</h3>
        <label>Volume: <input type="range" min="0" max="1" step="0.01" value.bind="volume" input.trigger="onVolumeChange($event)" /></label>
      </div>
  </div>
</template>
