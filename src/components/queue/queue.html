<template>
  <section class="queue" aria-labelledby="queue-title">
    <header class="queue-heading">
      <h2 id="queue-title">Up next</h2>
      <span>${items.length} ${items.length === 1 ? 'track' : 'tracks'}</span>
    </header>
    <ul>
      <li repeat.for="item of items">
        <span class="queue-track-name" title.bind="item.name">${item.name}</span>
        <button class="queue-remove" type="button" click.trigger="remove(item)" disabled.bind="isPlaying && $index === 0" title="Remove from queue" aria-label="Remove from queue">×</button>
      </li>
    </ul>
    <p class="queue-empty" if.bind="!items.length">Add a track from your collection.</p>
  </section>
</template>
