<require from="./my-app.scss"></require>
<require from="./components/player-dock/player-dock"></require>
<require from="./components/toast-host/toast-host"></require>

<nav class="app-nav" aria-label="Main navigation">
  <div class="links">
    <a if.bind="queueCount > 0" href="queue">Queue</a>
    <a href="library">Library</a>
    <a href="youtube">YouTube</a>
    <a href="settings">Settings</a>
    <button class="theme-toggle" type="button" click.trigger="toggleTheme()" title.bind="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'" aria-label.bind="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'">${theme === 'dark' ? '☀' : '☾'}</button>
  </div>
</nav>

<main class="app-main">
  <au-viewport></au-viewport>
</main>

<player-dock></player-dock>
<toast-host></toast-host>
